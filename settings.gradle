pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'dead-air-pip-boy-radio-conversion'

includeBuild('../ESC - 1.20.4 Forge') {
    dependencySubstitution {
        substitute module('uk.co.extraspecialstudio:extraspecialcore') using project(':')
    }
}