pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'dead-air-pip-boy-radio-conversion'

includeBuild('../ESL - 1.20.6 NeoForge') {
    dependencySubstitution {
        substitute module('uk.co.extraspecialstudio:extraspeciallib') using project(':')
    }
}

includeBuild('../ESC - 1.20.6 NeoForge') {
    dependencySubstitution {
        substitute module('uk.co.extraspecialstudio:extraspecialcore') using project(':')
        substitute module('uk.co.extraspecialstudio.extraspecial:extraspecialcore') using project(':')
    }
}
